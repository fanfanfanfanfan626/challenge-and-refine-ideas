name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validate_release.py
